
name: Build and deploy Face Swap Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Unpack project archive
        run: |
          if [ -f face-swap-studio.zip ] && [ ! -f index.html ]; then
            mkdir -p .source-unpack
            unzip -q face-swap-studio.zip -d .source-unpack
            cp -a .source-unpack/. .
            rm -rf .source-unpack
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download MediaPipe assets
        run: bash scripts/fetch-assets.sh
      - name: Verify assets
        run: |
          test -s vendor/mediapipe/vision_bundle.mjs
          test -s vendor/mediapipe/wasm/vision_wasm_internal.wasm
          test -s models/face_landmarker.task
      - name: Assemble site
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js dist/
          cp -R css js vendor models dist/
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
